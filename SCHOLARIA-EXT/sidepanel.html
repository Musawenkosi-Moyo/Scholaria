<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Scholaria Assistant</title>
        <link rel="stylesheet" href="sidepanel.css">
    </head>
    <body>
        <div class="container">
            <div class="header">
            <h2>Scholaria Assistant</h2>
            </div>

            <div class="actions">
                <button id="summarizeBtn">Summarize</button>
                <button id="suggestBtn">Suggest Topics</button>
                <button id="simplifyBtn">Simplify</button>
                <button id="questionsBtn">Generate Questions</button>
                <button id="extractBtn">Extract Keywords</button>
                <button id="citationBtn">Provide Citations</button>
            </div>

             <div class="notes">
                <h3>Research Notes</h3>
                <textarea id="notes" placeholder="Write your research notes here."></textarea>
                <button id="saveNotesBtn">Save Notes</button>
            </div>

             <div id="results" class="results"> </div>

        </div>
        <script src="sidepanel.js"></script>
    </body>

    </html>
